Enter<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha IA Personalizada</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #1e1e2f; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 600px; background-color: #2a2a40; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 90vh; overflow: hidden; }
        #chat-header { background-color: #3b3b58; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #1e1e2f; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user-message { background-color: #4CAF50; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .ai-message { background-color: #444466; color: white; align-self: flex-start; border-bottom-left-radius: 0; }
        #input-area { display: flex; padding: 15px; background-color: #3b3b58; border-top: 1px solid #1e1e2f; }
        #user-input { flex: 1; padding: 12px; border: none; border-radius: 6px; background-color: #1e1e2f; color: white; outline: none; font-size: 1rem; }
        #send-btn { padding: 12px 20px; margin-left: 10px; border: none; border-radius: 6px; background-color: #4CAF50; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #send-btn:hover { background-color: #45a049; }
        #send-btn:disabled { background-color: #777; cursor: not-allowed; }
        .loading { font-size: 0.9rem; color: #aaa; font-style: italic; align-self: flex-start; display: none; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-header">🤖 Assistente Virtual</div>
        
        <div id="chat-box">
            <div class="message ai-message">Olá! Como posso te ajudar hoje?</div>
        </div>
        <div id="loading" class="loading">A IA está digitando...</div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Digite sua mensagem aqui..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // =====================================================================
        // 🔴 ATENÇÃO: COLOQUE SUA CHAVE DE API EXATAMENTE NA LINHA ABAIXO 🔴
        // =====================================================================
        
        const MINHA_CHAVE_API = "COLOQUE_SUA_API_AQUI"; 
        
        // =====================================================================

        // O Prompt de Sistema que define a personalidade da sua IA
        const promptDeSistema = {
            role: "system",
            content: "Você é um assistente virtual inteligente, educado e direto ao ponto. Responda sempre em português do Brasil de forma clara e objetiva."
        };

        // Histórico de mensagens (começa com o prompt de sistema)
        let historicoMensagens = [promptDeSistema];

        async function sendMessage() {
            const inputElement = document.getElementById("user-input");
            const message = inputElement.value.trim();
            const sendBtn = document.getElementById("send-btn");
            const loading = document.getElementById("loading");

            if (message === "") return;

            // Adiciona a mensagem do usuário na tela e no histórico
            addMessageToScreen(message, "user-message");
            historicoMensagens.push({ role: "user", content: message });
            
            inputElement.value = "";
            sendBtn.disabled = true;
            loading.style.display = "block";

            try {
                // Fazendo a requisição para a API (Formato OpenAI)
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${MINHA_CHAVE_API}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo", // Você pode mudar para gpt-4 se sua API suportar
                        messages: historicoMensagens,
                        temperature: 0.7 // Define a criatividade (0 a 1)
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;
                
                // Adiciona a resposta da IA na tela e no histórico
                addMessageToScreen(aiReply, "ai-message");
                historicoMensagens.push({ role: "assistant", content: aiReply });

            } catch (error) {
                console.error("Erro na API:", error);
                addMessageToScreen("⚠️ Erro de conexão ou API inválida. Verifique sua chave no código.", "ai-message");
            } finally {
                sendBtn.disabled = false;
                loading.style.display = "none";
                inputElement.focus();
            }
        }

        function addMessageToScreen(text, className) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Permite enviar apertando a tecla "Enter"
        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
